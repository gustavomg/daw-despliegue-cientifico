# Orquestación local/producción de "ClimaRed" — plataforma de ingesta y visualización de datos
# científicos de estaciones ambientales simuladas (temperatura, humedad, CO2, presión).
#
# Flujo de datos: sensor-sim → Redis (pub/sub) → backend (WebSocket en vivo + persistencia
# por lotes en Postgres) → nginx (frontend estático + proxy inverso).
#
# Uso:
#   cp .env.example .env      # y ajusta los valores si lo necesitas
#   docker compose up -d --build
#   docker compose ps
#   docker compose logs -f backend

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-climared}
      POSTGRES_PASSWORD: ${PGPASSWORD:-climared}
      POSTGRES_DB: ${PGDATABASE:-climared}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Se ejecuta automáticamente SOLO la primera vez que el volumen está vacío
      # (mecanismo estándar de la imagen oficial de Postgres).
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-climared}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [climared_net]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sin persistencia en disco: Redis se usa aquí solo como buffer pub/sub en memoria,
    # no como almacén definitivo (esa responsabilidad es de Postgres).
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [climared_net]

  # Generador de lecturas simuladas: publica en Redis, nunca escribe directamente en Postgres.
  # Falla rápido y con mensaje claro si no puede resolver/conectar con "redis" (ver README,
  # ejercicio de diagnóstico de red).
  sensor-sim:
    build:
      context: ./sensor-sim
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CHANNEL: climared:lecturas
      NUM_ESTACIONES: ${NUM_ESTACIONES:-5}
      INTERVALO_MS: ${INTERVALO_MS:-3000}
    depends_on:
      redis:
        condition: service_healthy
    networks: [climared_net]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${PGUSER:-climared}
      PGPASSWORD: ${PGPASSWORD:-climared}
      PGDATABASE: ${PGDATABASE:-climared}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CHANNEL: climared:lecturas
      RETENCION_DIAS: ${RETENCION_DIAS:-30}
      BATCH_INTERVAL_MS: ${BATCH_INTERVAL_MS:-5000}
      PURGA_INTERVALO_MS: ${PURGA_INTERVALO_MS:-3600000}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [climared_net]

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    networks: [climared_net]

networks:
  climared_net:
    driver: bridge

volumes:
  db_data:
