# Nginx como puerta de entrada única: sirve los estáticos del frontend y hace de proxy inverso
# hacia el backend para /api, /socket.io y /metrics (mismo origen -> sin problemas de CORS).
server {
    listen 80;
    server_name _;

    # --- Frontend estático (dashboard) ---
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- API REST ---
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket (Socket.IO): lecturas en tiempo real hacia el dashboard ---
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    # --- Métricas Prometheus del backend ---
    location /metrics {
        proxy_pass http://backend:3000/metrics;
    }
}
